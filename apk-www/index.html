<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>NailDash</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #FDF8F3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Poppins", sans-serif;
    }
    body { display: flex; align-items: center; justify-content: center; }
    .wrap { text-align: center; }
    .spinner {
      width: 44px; height: 44px; margin: 0 auto 1.25rem;
      border: 4px solid rgba(212, 117, 106, 0.18);
      border-top-color: #D4756A;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { margin: 0; font-size: 1.4rem; font-weight: 700; color: #2A2320; letter-spacing: -0.02em; }
    h2 span { color: #D4756A; }
    p { margin: 0.4rem 0 0; color: #9B8E84; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <h2>Nail<span>Dash</span></h2>
    <p>Conectando…</p>
  </div>
</body>
</html>
